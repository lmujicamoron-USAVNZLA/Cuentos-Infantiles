<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación - Story Creator Kids</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .verify-card {
            text-align: center;
            max-width: 400px;
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            color: var(--primary);
        }

        .status-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 2rem;
            background: #fef3c7;
            color: #d97706;
        }
    </style>
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="container">
        <div class="register-card verify-card">
            <header class="header">
                <div class="icon-box">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M22 17.002a6.002 6.002 0 0 1-11.713 1.783L10.24 17l-1.64-1.64a4 4 0 1 1 5.66-5.66l1.25 1.25a2 2 0 0 0 2.83 0l2.21-2.21a6.002 6.002 0 0 1 1.45 8.262ZM2 10.5V4a2 2 0 0 1 2-2h4M2 14v6a2 2 0 0 0 2 2h4M16 2h4a2 2 0 0 1 2 2v2" />
                    </svg>
                </div>
                <h1>Casi listo, <span id="userName">Aventurero</span></h1>
                <p>Te hemos enviado un correo mágico de verificación.</p>
            </header>

            <div class="status-badge" id="statusBadge">
                ⏳ Esperando verificación de correo y aprobación
            </div>

            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">
                Por seguridad infantil, debes confirmar el enlace que enviamos a tu email y un administrador revisará tu solicitud para darte acceso al reino.
            </p>

            <button class="submit-btn" id="checkBtn"
                style="background: var(--primary); color: white; margin-bottom: 0.75rem;"
                onclick="checkStatus()">
                ✨ Ya confirmé mi correo (Entrar al Reino)
            </button>

            <button class="submit-btn" id="resendBtn"
                style="background: white; color: var(--text-main); border: 1px solid var(--input-border); margin-bottom: 0.75rem;"
                onclick="resendEmail()">
                📧 Re-enviar correo mágico
            </button>

            <button class="submit-btn"
                style="background: transparent; color: var(--text-muted); border: none; font-size: 0.9rem;"
                onclick="window.location.href='login.html'">
                Ir a Iniciar Sesión
            </button>
        </div>
    </main>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // Configuración de Firebase Real
        const firebaseConfig = {
            apiKey: "AIzaSyA7vi4r6ahe-sZf8bFW0u1zCB54JkHPDFw",
            authDomain: "cuentos-infantiles-2026.firebaseapp.com",
            projectId: "cuentos-infantiles-2026",
            storageBucket: "cuentos-infantiles-2026.firebasestorage.app",
            messagingSenderId: "454293856709",
            appId: "1:454293856709:web:6b40a7fa1788e3681c6bac",
            measurementId: "G-GSLT5XHTPV"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        async function checkStatus() {
            const btn = document.getElementById('checkBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span>🔍 Comprobando...</span>';

            const user = firebase.auth().currentUser;
            if (!user) {
                alert("Por favor inicia sesión con tu correo y contraseña.");
                window.location.href = 'login.html';
                return;
            }

            try {
                // Recargar el usuario de Firebase Auth para actualizar emailVerified
                await user.reload();
                const refreshedUser = firebase.auth().currentUser;

                const isAdmin = refreshedUser.email === 'historycreatorkids@gmail.com' || refreshedUser.email === 'lmujimoron@gmail.com';

                if (!refreshedUser.emailVerified && !isAdmin) {
                    alert("Tu correo aún no figura como verificado. Por favor abre el enlace que te llegó a tu email y luego vuelve a presionar este botón.");
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                    return;
                }

                // Si está verificado el email, verificar estado en Firestore
                const db = firebase.firestore();
                const doc = await db.collection("users").doc(refreshedUser.uid).get();

                if (doc.exists) {
                    const data = doc.data();
                    // Sincronizar emailVerified en Firestore
                    if (!data.emailVerified) {
                        await db.collection("users").doc(refreshedUser.uid).update({ emailVerified: true });
                    }

                    if (data.status === 'aprobado' || isAdmin) {
                        alert("¡Bienvenido al reino mágico! 🌟 Todo listo.");
                        window.location.href = 'dashboard.html';
                        return;
                    } else {
                        document.getElementById('statusBadge').innerText = '✅ Correo verificado - Esperando aprobación de Guardián';
                        document.getElementById('statusBadge').style.background = '#dbeafe';
                        document.getElementById('statusBadge').style.color = '#1d4ed8';
                        alert("¡Tu correo ya está verificado! ✨ Tu cuenta está en revisión por un Administrador. En cuanto sea aprobada podrás entrar.");
                    }
                } else if (isAdmin) {
                    window.location.href = 'dashboard.html';
                    return;
                } else {
                    alert("No encontramos tu perfil. Por favor intenta registrarte de nuevo.");
                }
            } catch (err) {
                console.error("Error al comprobar:", err);
                alert("Hubo un error al comprobar tu cuenta: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        function resendEmail() {
            const user = firebase.auth().currentUser;
            if (user) {
                user.sendEmailVerification().then(() => {
                    alert("¡Correo re-enviado con éxito! Por favor revisa tu bandeja de entrada o la carpeta de Spam.");
                }).catch(err => {
                    alert("Error al enviar: " + err.message);
                });
            } else {
                alert("Para re-enviar el correo, inicia sesión en la pantalla de login.");
                window.location.href = 'login.html';
            }
        }

        // Obtener el nombre del usuario del registro previo
        document.getElementById('userName').innerText = localStorage.getItem('lastUser') || 'Aventurero';
    </script>
</body>

</html>
